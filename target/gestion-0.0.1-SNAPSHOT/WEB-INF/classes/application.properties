# Configuration des chemins de fichiers
app.file.upload-dir=E:/HP/Documents/S5/Mr Tovo/Gest_Entr/src/main/resources/static/uploads
app.file.releves-dir=E:/HP/Documents/S5/Mr Tovo/Gest_Entr/src/main/resources/static/releves
app.file.exports-dir=E:/HP/Documents/S5/Mr Tovo/Gest_Entr/src/main/resources/static/exports

# Taille max des uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Configuration de la base de données
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/gestion_entreprise?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ===============================
# Configuration JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


# ===============================
# Port du serveur
# ===============================
server.port=8081
spring.jpa.open-in-view=false

